name: iOS build (unsigned IPA)

on:
  push:
    branches: [ios-app]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/prepare-www.mjs
      - run: npx cap add ios
      - name: Use our app icon
        run: |
          set -e
          ICON_DIR=ios/App/App/Assets.xcassets/AppIcon.appiconset
          ls "$ICON_DIR"
          cp icons/icon-1024.png "$ICON_DIR/AppIcon-512@2x.png"
      - run: npx cap sync ios
      - name: Build unsigned archive
        run: |
          set -eo pipefail
          if [ -d ios/App/App.xcworkspace ]; then TARGET="-workspace ios/App/App.xcworkspace"; else TARGET="-project ios/App/App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos \
            -archivePath build/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 60
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qry workout.ipa Payload
          ls -la workout.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: workout-ipa
          path: workout.ipa
