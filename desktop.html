<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/dash.css">
  <title>기록 (데스크탑)</title>
  <style>
    #dt { display: grid; grid-template-columns: 300px 1fr; gap: 20px; max-width: 1400px; margin: 0 auto; padding: 20px; align-items: start; }
    #dt aside { position: sticky; top: 20px; max-height: calc(100vh - 40px); display: flex; flex-direction: column; gap: 8px; }
    #dt .list { overflow-y: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
    #dt .item { display: flex; justify-content: space-between; gap: 8px; width: 100%; padding: 9px 12px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--text); font: inherit; font-size: 14px; text-align: left; cursor: pointer; }
    #dt .item:hover { background: var(--bg); }
    #dt .item[aria-current="true"] { background: var(--accent); color: #fff; }
    #dt .item span:last-child { opacity: .7; font-variant-numeric: tabular-nums; }
    #dt main > .panel:first-child, #dt .tiles + .panel { margin-top: 12px; }
    #dt .tiles { margin-bottom: 0; }
    #dt table th, #dt table td { text-align: left; padding: 8px 10px; }
    #dt table th:nth-child(n+4), #dt table td:nth-child(n+4) { text-align: right; }
    #dt thead th { position: sticky; top: 0; background: var(--card); }
    #dt tbody tr:hover { background: var(--bg); }
    #dt .tablewrap { max-height: 70vh; overflow: auto; }
    .heat span { width: 14px; height: 14px; }
  </style>
</head>
<body>
  <div id="dt"></div>
  <script type="module" src="js/desktop.js"></script>
</body>
</html>
